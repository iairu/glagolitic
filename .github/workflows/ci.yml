name: CI - Test and Lint

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Frontend tests and linting
  frontend-ci:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: glagolitic-app/package-lock.json
      
      - name: Install dependencies
        run: |
          cd glagolitic-app
          npm ci
      
      - name: Lint frontend
        run: |
          cd glagolitic-app
          npm run build
      
      - name: Type check (if TypeScript)
        run: |
          cd glagolitic-app
          npm run build -- --no-warn
      
      - name: Build frontend
        run: |
          cd glagolitic-app
          npm run build

  # Rust tests and linting
  rust-ci:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: glagolitic-app/src-tauri -> target
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      
      - name: Format check
        run: |
          cd glagolitic-app/src-tauri
          cargo fmt -- --check
      
      - name: Clippy lint
        run: |
          cd glagolitic-app/src-tauri
          cargo clippy -- -D warnings
      
      - name: Build Rust
        run: |
          cd glagolitic-app/src-tauri
          cargo build --release

  # Security audit
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run security audit
        run: |
          cd glagolitic-app/src-tauri
          cargo audit || true  # Don't fail on warnings
