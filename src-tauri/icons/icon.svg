<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="120" fill="url(#bgGradient)"/>
  
  <!-- Glass effect overlay -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="url(#glassGradient)"/>
  
  <!-- Glagolitic letter Ⰳ (Glagoli) - main symbol -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="white" stroke-width="12" opacity="0.9"/>
    
    <!-- Glagolitic symbol Ⰳ -->
    <path d="M-60,-80 
             L-60,80 
             Q-60,100 -40,100 
             L40,100 
             Q60,100 60,80 
             L60,-80 
             Q60,-100 40,-100 
             L-40,-100 
             Q-60,-100 -60,-80 Z
             M-30,-50 L30,-50
             M-30,0 L30,0
             M-30,50 L30,50" 
          fill="white" 
          stroke="none"/>
    
    <!-- Decorative elements -->
    <circle cx="0" cy="-120" r="8" fill="white" opacity="0.8"/>
    <circle cx="-100" cy="60" r="6" fill="white" opacity="0.6"/>
    <circle cx="100" cy="60" r="6" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Text "ⰃⰎⰀ" at bottom -->
  <text x="256" y="420" 
        font-family="serif" 
        font-size="36" 
        fill="white" 
        text-anchor="middle" 
        opacity="0.9"
        letter-spacing="8">ⰃⰎⰀ</text>
</svg>
