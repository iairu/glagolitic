name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # macOS Universal build (Intel + Silicon)
  build-macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Universal macOS app
        run: npm run tauri build

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-macos-universal
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Windows build
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows app (MSI)
        run: npm run tauri build

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload Windows NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Linux build
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            libxdo-dev \
            libxcb1 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libssl-dev \
            pkg-config \
            libudev-dev \
            libasound2-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Linux app (AppImage)
        run: npm run tauri build

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Linux DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload Linux RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # Create release on tag
  create-release:
    runs-on: ubuntu-22.04
    needs: [build-macos-universal, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/glagolitic-converter-macos-universal/**/*.dmg
            artifacts/glagolitic-converter-windows-msi/**/*.msi
            artifacts/glagolitic-converter-windows-exe/**/*.exe
            artifacts/glagolitic-converter-linux-appimage/**/*.AppImage
            artifacts/glagolitic-converter-linux-deb/**/*.deb
            artifacts/glagolitic-converter-linux-rpm/**/*.rpm
