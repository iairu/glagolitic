name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # macOS Intel build
  build-macos-intel:
    runs-on: macos-13
    strategy:
      matrix:
        target: [x86_64-apple-darwin]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: glagolitic-app/package-lock.json
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: glagolitic-app/src-tauri -> target
      
      - name: Install dependencies
        run: |
          cd glagolitic-app
          npm ci
      
      - name: Build frontend
        run: |
          cd glagolitic-app
          npm run build
      
      - name: Build Tauri app
        run: |
          cd glagolitic-app
          npm run tauri build -- --target ${{ matrix.target }}
      
      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-macos-intel
          path: glagolitic-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # macOS Apple Silicon build
  build-macos-silicon:
    runs-on: macos-14
    strategy:
      matrix:
        target: [aarch64-apple-darwin]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: glagolitic-app/package-lock.json
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: glagolitic-app/src-tauri -> target
      
      - name: Install dependencies
        run: |
          cd glagolitic-app
          npm ci
      
      - name: Build frontend
        run: |
          cd glagolitic-app
          npm run build
      
      - name: Build Tauri app
        run: |
          cd glagolitic-app
          npm run tauri build -- --target ${{ matrix.target }}
      
      - name: Upload macOS Silicon artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-macos-silicon
          path: glagolitic-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # macOS Universal build (combines Intel + Silicon)
  build-macos-universal:
    runs-on: macos-14
    needs: [build-macos-intel, build-macos-silicon]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: glagolitic-app/package-lock.json
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: glagolitic-app/src-tauri -> target
      
      - name: Install dependencies
        run: |
          cd glagolitic-app
          npm ci
      
      - name: Build frontend
        run: |
          cd glagolitic-app
          npm run build
      
      - name: Build Universal macOS app
        run: |
          cd glagolitic-app
          # Build for both architectures and create universal binary
          cargo lipo --manifest-path src-tauri/Cargo.toml --release
          
          # Create universal app bundle
          npm run tauri build -- --target universal-apple-darwin || npm run tauri build
      
      - name: Upload macOS Universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-macos-universal
          path: |
            glagolitic-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            glagolitic-app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # Windows build
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: glagolitic-app/package-lock.json
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: glagolitic-app/src-tauri -> target
      
      - name: Install dependencies
        run: |
          cd glagolitic-app
          npm ci
      
      - name: Build frontend
        run: |
          cd glagolitic-app
          npm run build
      
      - name: Build Tauri app
        run: |
          cd glagolitic-app
          npm run tauri build -- --target ${{ matrix.target }}
      
      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-windows-msi
          path: glagolitic-app/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
      
      - name: Upload Windows NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-windows-exe
          path: glagolitic-app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Linux build
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: glagolitic-app/package-lock.json
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            libxdo-dev \
            libxcb1 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libssl-dev \
            pkg-config \
            libudev-dev \
            libasound2-dev
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: glagolitic-app/src-tauri -> target
      
      - name: Install dependencies
        run: |
          cd glagolitic-app
          npm ci
      
      - name: Build frontend
        run: |
          cd glagolitic-app
          npm run build
      
      - name: Build Tauri app (AppImage)
        run: |
          cd glagolitic-app
          npm run tauri build -- --target ${{ matrix.target }}
      
      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-linux-appimage
          path: glagolitic-app/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      
      - name: Upload Linux DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-linux-deb
          path: glagolitic-app/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
      
      - name: Upload Linux RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: glagolitic-converter-linux-rpm
          path: glagolitic-app/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: warn

  # Create release on tag
  create-release:
    runs-on: ubuntu-22.04
    needs: [build-macos-intel, build-macos-silicon, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/glagolitic-converter-macos-intel/**/*.dmg
            artifacts/glagolitic-converter-macos-silicon/**/*.dmg
            artifacts/glagolitic-converter-windows-msi/**/*.msi
            artifacts/glagolitic-converter-windows-exe/**/*.exe
            artifacts/glagolitic-converter-linux-appimage/**/*.AppImage
            artifacts/glagolitic-converter-linux-deb/**/*.deb
            artifacts/glagolitic-converter-linux-rpm/**/*.rpm
